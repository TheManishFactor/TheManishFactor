      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1500" height="420" rx="28" fill="url(#bg)"/>
  <ellipse cx="1190" cy="180" rx="470" ry="330" fill="url(#halo)"/>
  <g fill="none" stroke="url(#glow)" opacity=".42">
